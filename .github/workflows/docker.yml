# 打 v* tag 就自動 build 多架構 image（linux/amd64 + linux/arm64）並 push。
#
# 目標 registry：
#   - GHCR（ghcr.io/weiting-tw/mcp-email）：用內建 GITHUB_TOKEN，免任何外部 secret。
#   - Docker Hub（docker.io/<user>/mcp-email）：需在 repo 加兩個 secret：
#       DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（Docker Hub → Account → Security → New Access Token）
#     沒設這兩個 secret 時，自動略過 Docker Hub、只發 GHCR（不會讓 workflow 失敗）。
#
# 補發某個已存在的 tag（如 v0.3.0）：Actions → docker → Run workflow → 填 tag。
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要建置的 git tag（如 v0.3.0）"
        required: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 用 GITHUB_TOKEN push 到 GHCR
    steps:
      - name: 解析要建置的 ref 與版本
        id: ver
        run: |
          REF="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.ref }}

      - name: 偵測 Docker Hub secret 是否設定
        id: hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未設定 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN，略過 Docker Hub，只發 GHCR"
          fi

      - uses: docker/setup-qemu-action@v3   # 讓 runner 能跨架構模擬（arm64）
      - uses: docker/setup-buildx-action@v3

      - name: 登入 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登入 Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 組出要 push 的 image 清單
        id: images
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          imgs="ghcr.io/${{ github.repository }}"
          if [ "${{ steps.hub.outputs.enabled }}" = "true" ]; then
            imgs="${imgs}"$'\n'"docker.io/${DH_USER}/mcp-email"
          fi
          { echo "list<<EOF"; echo "$imgs"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: 產生 tags / labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build（amd64 + arm64）並 push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
