[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-email"
version = "0.4.0"
description = "IMAP/SMTP 信箱 MCP server — 把任意標準信箱（Gmail/Outlook/自架…）包成 MCP tools；支援本地 stdio 與遠端 HTTP/OAuth 部署"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Weiting-tw" }]
keywords = ["mcp", "model-context-protocol", "email", "imap", "smtp", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Email",
    "Operating System :: OS Independent",
]
dependencies = ["mcp[cli]>=1.28"]

[project.optional-dependencies]
oauth = ["cryptography>=42"]   # --oauth 模式（claude.ai Connectors）才需要
dev = ["aiosmtpd>=1.4", "cryptography>=42", "pytest>=8"]

[project.scripts]
mcp-email = "mcp_email:cli"

[project.urls]
Homepage = "https://github.com/weiting-tw/mcp-email"
Repository = "https://github.com/weiting-tw/mcp-email"
Issues = "https://github.com/weiting-tw/mcp-email/issues"

[tool.setuptools]
py-modules = ["mcp_email", "mcp_email_oauth"]
